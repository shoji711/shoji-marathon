name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Staging via SSH (and smoke test inside server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dev.marathon.rplearn.net
          username: tomoya_shoji
          key: ${{ secrets.STG_SSH_KEY }}
          script: |
            set -e

            echo "### [STG] pull /app/develop"
            cd /app/develop
            git pull

            echo "### [STG] deploy web files to nginx dir"
            WEB_DIR="/usr/share/nginx/html/tomoya_shoji"
            rm -rf "${WEB_DIR:?}/"*
            cp -ipr ./src/web/* "$WEB_DIR/"

            if [ -f "$WEB_DIR/prod_config.js" ]; then
              mv "$WEB_DIR/prod_config.js" "$WEB_DIR/config.js"
            fi

            echo "### [STG] smoke test from localhost (no external access needed)"
            curl -fsS -H "Host: dev.marathon.rplearn.net" \
              http://127.0.0.1/tomoya_shoji/customer/add.html > /dev/null

  deploy-production:
    name: Deploy to Production (marathon)
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Production via SSH (and smoke test inside server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: marathon.rplearn.net
          username: tomoya_shoji
          key: ${{ secrets.PRD_SSH_KEY }}
          script: |
            set -e

            echo "### [PRD] pull /app/tomoya_shoji"
            cd /app/tomoya_shoji
            git pull

            echo "### [PRD] run deploy"
            bash ./deploy.sh tomoya_shoji

            echo "### [PRD] smoke test from localhost"
            curl -fsS -H "Host: marathon.rplearn.net" \
              http://127.0.0.1/tomoya_shoji/customer/add.html > /dev/null

