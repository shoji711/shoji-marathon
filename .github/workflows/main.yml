name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dev.marathon.rplearn.net
          username: tomoya_shoji
          key: ${{ secrets.STG_SSH_KEY }}
          script: |
            set -e
            echo "### whoami"; whoami
            echo "### hostname"; hostname
            echo "### pwd"; pwd
            echo "### ls /app/develop"; ls -la /app/develop | head -n 80
            echo "### find deploy.sh (top)"; find /app -maxdepth 5 -name deploy.sh -print 2>/dev/null || true
            echo "### run deploy"
            bash /app/deploy.sh tomoya_shoji
            echo "### listen check"
            ss -lntp | egrep ':(5425)\b' || echo "5425 not listening (may be ok depending on deploy)"

      - name: Smoke test (Staging)
        run: |
          set -e
          curl -fsS -H "Host: dev.marathon.rplearn.net" \
            http://dev.marathon.rplearn.net/tomoya_shoji/customer/add.html > /dev/null

  deploy-production:
    name: Deploy to Production (marathon)
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: marathon.rplearn.net
          username: tomoya_shoji
          key: ${{ secrets.PRD_SSH_KEY }}
          script: |
            set -e
            cd /app/tomoya_shoji
            bash ./deploy.sh tomoya_shoji
            ss -lntp | egrep ':(5425)\b' || echo "5425 not listening (may be ok depending on deploy)"

      - name: Smoke test (Production)
        run: |
          set -e
          curl -fsS -H "Host: marathon.rplearn.net" \
            http://marathon.rplearn.net/tomoya_shoji/customer/add.html > /dev/null

